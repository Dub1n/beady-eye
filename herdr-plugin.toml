id = "dub1n.beady-eye"
name = "beady-eye"
version = "0.42.2"
min_herdr_version = "0.9.1"
platforms = ["linux", "macos"]
description = "Opens bdi in a split beside the focused pane: the trees of work in that pane's project, with what each agent is doing beside its bead. Part of beady-eye."

# Builds this fork from its own checkout; requires Rust 1.88+.
# `herdr plugin link` skips builds: run sh herdr/build.sh before linking.
[[build]]
command = ["sh", "herdr/build.sh"]

# The pane starts in the focused pane's directory rather than the plugin root,
# so bdi is named by absolute path. bdi's own error is all that says why it
# refused to start, so a failed start holds the pane until the reader has read it.
[[panes]]
id = "eye"
title = "bdi"
placement = "split"
command = ["sh", "-c", "\"$HERDR_PLUGIN_ROOT/bin/bdi\" || { printf '\\nbdi exited %s. Press Enter to close.' \"$?\"; read -r _; }"]

[[actions]]
id = "open"
title = "beady-eye: open"
contexts = ["pane", "workspace"]
command = ["sh", "herdr/open.sh"]
